</style></head><body><div id="app"></div><dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s),K='finplan_v1',T=new Date(),pd=n=>String(n).padStart(2,'0'),iso=d=>d.getFullYear()+'-'+pd(d.getMonth()+1)+'-'+pd(d.getDate());
let S=JSON.parse(localStorage.getItem(K)||'null')||{acc:[],cards:[],tx:[],plan:[],paid:{},budget:0};
let V={t:'home',y:T.getFullYear(),m:T.getMonth()};
const id=()=>Math.random().toString(36).slice(2,9),save=()=>{localStorage.setItem(K,JSON.stringify(S));render()},no=m=>(alert(m),false);
const f=n=>(n<0?'-':'')+'₹'+Math.abs(Math.round(n)).toLocaleString('en-IN'),e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sum=(a,k='a')=>a.reduce((x,y)=>x+(+y[k]||0),0),put=(arr,o,r)=>o.id?Object.assign(o,r):arr.push({...r,id:id()});

const bar=(p,c)=>`<div class=bar><i style="width:${Math.min(100,Math.max(0,p))}%;background:${c}"></i></div>`;
// Card bill for the statement whose due date falls in month (y,m)
function bill(c,y,m){const st=c.due>c.bill?dt(y,m,c.bill):dt(y,m-1,c.bill),s=new Date(st+'T00:00'),pv=dt(s.getFullYear(),s.getMonth()-1,c.bill),nx=dt(s.getFullYear(),s.getMonth()+1,c.bill);
const ex=S.tx.filter(t=>t.t=='exp'&&t.s==c.id),billed=sum(ex.filter(t=>t.d>pv&&t.d<=st)),paid=sum(S.tx.filter(t=>t.t=='pay'&&t.cd==c.id&&t.d>st&&t.d<=dt(y,m+1,0)));

// Interest-free days for a purchase made today
function free(c){const t=iso(T);let ns=dt(T.getFullYear(),T.getMonth(),c.bill);if(ns<t)ns=dt(T.getFullYear(),T.getMonth()+1,c.bill);const s=new Date(ns+'T00:00');let du=dt(s.getFullYear(),s.getMonth(),c.due);if(du<=ns)du=dt(s.getFullYear(),s.getMonth()+1,c.due);return Math.round((new Date(du)-new Date(t))/864e5)}
function form(h,fl,ok,del){const d=$('#dlg');d.innerHTML=`<form><h3>${h}</h3>${fl.map(x=>`<label>${x.l}${x.o?`<select name=${x.k}>${x.o.map(o=>`<option value="${e(o[0])}"${o[0]==x.v?' selected':''}>${e(o[1])}</option>`).join('')}</select>`:`<input name=${x.k} type=${x.t||'text'}${x.t=='number'?' step=any inputmode=decimal':''} value="${e(x.v)}">`}</label>`).join('')}<div class=row><button type=button onclick="dlg.close()">Cancel</button>${del?'<button type=button class=bad id=dl>Delete</button>':''}<button class=pri>Save</button></div></form>`;
const fm=d.firstChild;fm.onsubmit=ev=>{ev.preventDefault();if(ok(Object.fromEntries(new FormData(fm)))!==false)d.close()};if(del)$('#dl').onclick=()=>{if(confirm('Delete this item?')){del();d.close()}};d.showModal();history.pushState({t:V.t,dlg:1},'')}
const opts=(cd)=>[...S.acc.map(a=>[a.id,a.n]),...(cd?S.cards.map(c=>[c.id,c.n+' (card)']):[])];
function txForm(o={}){form(o.id?'Edit entry':'Add entry',[{k:'t',l:'Type',o:[['exp','Expense'],['inc','Income'],['inv','Investment'],['pay','Card bill payment']],v:o.t||'exp'},{k:'a',l:'Amount',t:'number',v:o.a},{k:'d',l:'Date',t:'date',v:o.d||iso(T)},{k:'c',l:'Category',v:o.c},{k:'s',l:'Account or card (card only for expenses)',o:opts(1),v:o.s},{k:'cd',l:'Card being paid (bill payment only)',o:[['','-'],...S.cards.map(c=>[c.id,c.n])],v:o.cd},{k:'n',l:'Note',v:o.n}],
r=>{r.a=+r.a;if(!r.a||!r.s)return no('Amount and account are needed');if(r.t!='exp'&&S.cards.some(c=>c.id==r.s))return no('Pick a bank account for this type');if(r.t=='pay'&&!r.cd)return no('Choose the card being paid');if(r.t!='pay')r.cd='';if(r.t=='pay'){const cc=S.cards.find(x=>x.id==r.cd);if(cc)cc.pa=r.s}put(S.tx,o,r);save()},o.id&&(()=>{S.tx=S.tx.filter(x=>x.id!=o.id);save()}))}

function cardForm(o={}){form(o.id?'Edit card':'Add credit card',[{k:'n',l:'Card name',v:o.n},{k:'limit',l:'Credit limit',t:'number',v:o.limit},{k:'bill',l:'Billing (statement) day of month',t:'number',v:o.bill},{k:'due',l:'Payment due day of month',t:'number',v:o.due},{k:'pa',l:'Usually paid from (bank account)',o:[['','-'],...opts(0)],v:o.pa}],r=>{['limit','bill','due'].forEach(k=>r[k]=+r[k]);if(!r.n||r.bill<1||r.bill>31||r.due<1||r.due>31)return no('Enter name, billing day and due day (1-31)');put(S.cards,o,r);save()},o.id&&(()=>{S.cards=S.cards.filter(x=>x.id!=o.id);save()}))}

function payCard(i){const c=S.cards.find(x=>x.id==i),b=bill(c,V.y,V.m);if(!c.pa||!S.acc.some(a=>a.id==c.pa))return txForm({t:'pay',s:'',cd:i,a:Math.round(b.pay)});if(!confirm('Pay '+f(b.pay)+' to '+c.n+' from '+src(c.pa)+'?'))return;S.tx.push({id:id(),d:iso(T),t:'pay',a:b.pay,c:'Card payment',n:c.n+' bill',s:c.pa,cd:i});save()}
const COL=['#6366F1','#14B8A6','#F59E0B','#EC4899','#3B82F6','#9CA3AF'],GR=['#4338CA,#7C3AED','#0F766E,#0D9488','#B45309,#D97706','#BE185D,#DB2777','#1D4ED8,#2563EB'];
function fd(){const k=ym(V.y,V.m),u=p=>!S.paid[p.id+'|'+k],cash=S.acc.reduce((s,a)=>s+accBal(a),0),pi=sum(S.plan.filter(p=>p.k=='inc'&&u(p))),pp=sum(S.plan.filter(p=>p.k=='exp'&&u(p))),pv=sum(S.plan.filter(p=>p.k=='inv'&&u(p))),cp=sum(S.cards.map(c=>bill(c,V.y,V.m)),'pay');return{cash,pi,pp,pv,cp,end:cash+pi-pp-pv-cp}}
const ring=(p,c,s=64)=>`<svg width=${s} height=${s} viewBox="0 0 64 64" role=img aria-label="${Math.round(p*100)} percent"><circle cx=32 cy=32 r=26 fill=none stroke="var(--line)" stroke-width=8 /><circle cx=32 cy=32 r=26 fill=none stroke="${c}" stroke-width=8 stroke-linecap=round stroke-dasharray="${Math.min(1,p)*163.4} 163.4" transform="rotate(-90 32 32)"/><text x=32 y=37 text-anchor=middle font-size=12 font-weight=700 fill="var(--ink)">${Math.round(p*100)}%</text></svg>`;

const budForm=()=>form('Monthly budget',[{k:'b',l:'Total monthly spending budget',t:'number',v:S.budget||''}],r=>{S.budget=+r.b||0;save()});
const tg=i=>{const p=S.plan.find(x=>x.id==i),k=i+'|'+ym(V.y,V.m);if(S.paid[k]){S.tx=S.tx.filter(t=>t.id!=S.paid[k]);delete S.paid[k]}else{let a=p.a;if(!a){a=+prompt('Amount for '+p.n+'?')||0;if(!a)return}const t={id:id(),d:dt(V.y,V.m,p.day),t:p.k,a,c:p.c||p.n,n:p.n,s:p.s};S.tx.push(t);S.paid[k]=t.id}save()};
const bk=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='finance-backup-'+iso(T)+'.json';a.click()};
const ld=i=>{const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(j.months){if(!confirm('Old tracker backup found. Import it and replace current data?'))return;S=convertOld(j);save();alert('Imported. Please check your account balances in More.')}else{S=j;save()}}catch(x){alert('Invalid backup file')}};r.readAsText(i.files[0])};
function convertOld(j){const M3=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],R={acc:[],cards:[],tx:[],plan:[],paid:{},budget:0},pk=k=>k.split('-')[1]*12+M3.indexOf(k.split('-')[0]),ks=Object.keys(j.months).sort((a,b)=>pk(a)-pk(b)),L=j.months[j.activeMonth]||j.months[ks[ks.length-1]],sid=s=>String(s||'').split(':')[1]||'',slug=s=>String(s).trim().toLowerCase().replace(/[^a-z0-9]+/g,'_');
ks.forEach(k=>{const m=j.months[k],y=+k.split('-')[1],mi=M3.indexOf(k.split('-')[0]),mk=ym(y,mi);
(m.expenses||[]).forEach(x=>R.tx.push({id:id(),d:x.date,t:'exp',a:+x.amount||0,c:x.category,n:String(x.description||'').trim(),s:sid(x.source)}));
[['incomes','inc','target','isReceived','lastRecAmt'],['fixed','exp','source','isPaid','lastPaidAmt'],['invest','inv','source','isPaid','lastPaidAmt']].forEach(([a,t,sk,fl,la])=>(m[a]||[]).forEach(p=>{const pid=t+'_'+slug(p.name),amt=+(p[la]||p.amount)||0,nm=String(p.name).trim();
if(m===L)R.plan.push({id:pid,n:nm,k:t,a:+p.amount||0,day:+p.day,s:sid(p[sk]),c:nm});
if(p[fl]&&amt){const x={id:id(),d:dt(y,mi,+p.day),t,a:amt,c:nm,n:nm,s:sid(p[sk])};R.tx.push(x);R.paid[pid+'|'+mk]=x.id}}))});
(L.banks||[]).forEach(b=>R.acc.push({id:b.id,n:String(b.name).trim(),o:(+b.balance||0)-R.tx.reduce((s,t)=>s+(t.s==b.id?(t.t=='inc'?t.a:-t.a):0),0)}));
const t0=iso(T),Y=T.getFullYear(),Mo=T.getMonth();
(L.cards||[]).forEach(c=>{const o={id:c.id,n:String(c.name).trim(),limit:+c.limit||0,bill:+c.billDay,due:+c.dueDay};R.cards.push(o);
const th=dt(Y,Mo,o.bill),ls=th<=t0?th:dt(Y,Mo-1,o.bill),s=new Date(ls+'T00:00'),pv=dt(s.getFullYear(),s.getMonth()-1,o.bill),ex=R.tx.filter(t=>t.t=='exp'&&t.s==o.id),
bi=sum(ex.filter(t=>t.d>pv&&t.d<=ls)),un=sum(ex.filter(t=>t.d>ls));

const mv=d=>{V.m+=d;if(V.m<0){V.m=11;V.y--}if(V.m>11){V.m=0;V.y++}render()};

function home(){const M=mt().filter(t=>!t.adj),inc=sum(M.filter(t=>t.t=='inc')),ex=sum(M.filter(t=>t.t=='exp')),iv=sum(M.filter(t=>t.t=='inv')),cash=S.acc.reduce((s,a)=>s+accBal(a),0),debt=S.cards.reduce((s,c)=>s+cardOut(c),0),lim=sum(S.cards,'limit'),mm={};
S.tx.filter(t=>t.t=='exp'&&!t.adj).forEach(t=>mm[t.d.slice(0,7)]=(mm[t.d.slice(0,7)]||0)+t.a);
const ks=Object.keys(mm).sort().slice(-3),avg=ks.length?ks.reduce((s,k)=>s+mm[k],0)/ks.length:0,run=avg?cash/avg:0,rate=inc?(inc-ex)/inc:0,util=lim?debt/lim:0,
sc=Math.round(40*Math.min(1,Math.max(0,rate/.3))+30*Math.min(1,run/6)+30*(1-Math.min(1,util/.6))),bl=S.cards.map(c=>bill(c,V.y,V.m)),F=fd();
const dn=new Date(V.y,V.m+1,0).getDate(),td=cur()?T.getDate():dn;let cu=0;const pt=[];for(let d=1;d<=td;d++){cu+=sum(M.filter(t=>t.t=='exp'&&+t.d.slice(8)==d));pt.push([d,cu])}
const pj=cur()&&td?cu/td*dn:cu,mx=Math.max(S.budget,pj,1),X=d=>10+(d-1)/(dn-1)*320,Y=v=>120-v/mx*110;
const pace=S.budget?`<svg viewBox="0 0 340 130" width=100% role=img aria-label="Budget pace chart"><line x1=10 y1=120 x2=330 y2=120 stroke="var(--line)"/><line x1="${X(1)}" y1="${Y(0)}" x2="${X(dn)}" y2="${Y(S.budget)}" stroke="var(--mut)" stroke-width=2 stroke-dasharray="5 4"/><polyline fill=none stroke="var(--pri)" stroke-width=3 stroke-linejoin=round points="${pt.map(p=>X(p[0])+','+Y(p[1])).join(' ')}"/>${cur()?`<line x1="${X(td)}" y1="${Y(cu)}" x2="${X(dn)}" y2="${Y(pj)}" stroke="var(--warn)" stroke-width=3 stroke-dasharray="2 5" stroke-linecap=round />`:''}</svg><div class="${pj>S.budget?'wn':'ok'}"><b>${pj>S.budget?'On track to overshoot by '+f(pj-S.budget):'On track to finish '+f(S.budget-pj)+' under budget'}</b></div>`:'<div class=m>Set a monthly budget in More to see your spending pace.</div>';
const cg={};M.filter(t=>t.t=='exp').forEach(t=>cg[t.c||'Other']=(cg[t.c||'Other']||0)+t.a);let cl=Object.entries(cg).sort((a,b)=>b[1]-a[1]);if(cl.length>5)cl=[...cl.slice(0,5),['Other',sum(cl.slice(5).map(x=>({a:x[1]})))]];
return `${S.acc.length?'':'<div class=c><b>Start here</b><div class=m>Open More, add a bank account, then add your credit cards and tap + to log entries.</div></div>'}
<div class=hero>${cur()?`<div style="font-size:13px;opacity:.9">Expected balance at month end</div><div style="font-size:32px;font-weight:700">${f(F.end)}</div><div style="font-size:13px;opacity:.9">Cash today ${f(F.cash)} · Net worth ${f(cash-debt)}</div>
<details style="margin-top:10px"><summary style="font-size:13px">How this adds up</summary>${[['Cash today',F.cash],['+ Expected income',F.pi],['- Planned payments',F.pp],['- Planned investments',F.pv],['- Card bills due',F.cp]].map(([l,v])=>`<div class=r style="font-size:13px"><span>${l}</span><b>${f(v)}</b></div>`).join('')}</details>`:`<div style="font-size:13px;opacity:.9">Left after spending and investing</div><div style="font-size:32px;font-weight:700">${f(inc-ex-iv)}</div><div style="font-size:13px;opacity:.9">Income ${f(inc)} · Spent ${f(ex)}</div>`}</div>
<div class=tiles><div class=tile style="background:rgba(20,184,166,.16)"><span class=m>Income</span><b>${f(inc)}</b></div><div class=tile style="background:rgba(245,158,11,.18)"><span class=m>Spent</span><b>${f(ex)}</b></div><div class=tile style="background:rgba(99,102,241,.18)"><span class=m>Invested</span><b>${f(iv)}</b></div></div>
<div class=c onclick="go('cards')"><h3>Credit card bills</h3><div class=g><div><div class=big>${f(sum(bl,'pay'))}</div><div class=m>payable this month</div></div><div><div class=big>${f(sum(bl,'carry'))}</div><div class=m>carries to next month</div></div></div></div>
<div class=c><h3>Where the money went</h3>${cl.length?`<div style="display:flex;gap:12px;align-items:center">${donut(cl,ex||1)}<div style="flex:1">${cl.map(([k,v],i)=>`<div class=r style="padding:3px 0;font-size:13px"><span><i class=dot style="background:${COL[i]}"></i>${e(k)}</span><b>${Math.round(v/ex*100)}%</b></div>`).join('')}</div></div>`:'<div class=m>No expenses yet.</div>'}</div>
<div class=c><h3>Budget pace</h3>${pace}</div>
<div class=c style="display:flex;gap:14px;align-items:center">${ring(sc/100,sc>=70?'var(--ok)':sc>=45?'var(--warn)':'var(--bad)',72)}<div style="flex:1"><h3 style="margin:0 0 4px">Financial health</h3><div class=m>Savings rate ${Math.round(rate*100)}% · Runway ${run.toFixed(1)} mo · Card use ${Math.round(util*100)}%</div></div></div>`}

function cards(){const bf=S.cards.map(c=>[c,free(c)]),best=[...bf].sort((a,b)=>b[1]-a[1])[0],bl=S.cards.map(c=>bill(c,V.y,V.m));
return `<div class=c><h3>${mo()} card bills</h3><div class=g><div><div class=m>Pay this month</div><div class=big>${f(sum(bl,'pay'))}</div></div><div><div class=m>Carries to next month</div><div class=big>${f(sum(bl,'carry'))}</div></div></div></div>
${best&&bf.length>1?`<div class=c style="background:#E8E7FF;color:#1B1F3B"><b>Best card today: ${e(best[0].n)}</b><div style="font-size:13px">${best[1]} interest-free days on a purchase made today.</div></div>`:''}
${S.cards.map((c,i)=>{const b=bl[i],o=cardOut(c),u=c.limit?o/c.limit*100:0,k=u<30?'ok':u<50?'wn':'bad';return `<div class=c><div class=cc style="background:linear-gradient(135deg,${GR[i%5]})"><div class=r><b>${e(c.n)}</b><button class=gb onclick="cardForm(S.cards.find(x=>x.id=='${c.id}'))">Edit</button></div><div style="font-size:13px;opacity:.9">Bills on ${c.bill} · due on ${c.due}</div><div class=big>${f(o)}</div><div style="font-size:13px;opacity:.9">of ${f(c.limit)} limit</div></div>
<div class=r><span class=m>Utilization</span><b class=${k}>${Math.round(u)}%</b></div>${bar(u,`var(--${k=='bad'?'bad':k=='wn'?'warn':'ok'})`)}<div style="height:8px"></div>
<div class=r><span>Statement ${b.open?'closes':'closed'} ${b.st.slice(5)}</span><b>${f(b.billed)}</b></div><div class=r><span>Paid</span><b>${f(b.paid)}</b></div><div class=r><span>Payable by ${b.dueD.slice(5)}</span><b class="${b.pay?'wn':'ok'}">${f(b.pay)}</b></div><div class=r><span>Carries to next month</span><b>${f(b.carry)}</b></div>
${b.pay>0?`<button class=pri style="width:100%" onclick="payCard('${c.id}')">Pay ${f(b.pay)}${c.pa?' from '+e(src(c.pa)):''}</button>`:`<div class=ok><b>${b.billed?'Paid in full':'Nothing due this month'}</b></div>`}<button style="width:100%;margin-top:8px" onclick="txForm({t:'pay',s:'${c.pa||''}',cd:'${c.id}'})">Other payment amount</button></div>`}).join('')}
<button onclick="cardForm()">Add credit card</button>`}

const KS={exp:['Payments','var(--warn)','payment'],inv:['Investments','var(--pri)','investment'],inc:['Income','var(--ok)','income']};
function plan(){const k=ym(V.y,V.m),pt=V.pt||'exp',d=p=>S.paid[p.id+'|'+k],L=S.plan.filter(p=>p.k==pt).sort((a,b)=>a.day-b.day),tot=sum(L),dn=sum(L.filter(d)),bl=S.cards.map(c=>({c,b:bill(c,V.y,V.m)})).filter(x=>x.b.billed||x.b.pay);
return `<div class=seg>${Object.keys(KS).map(x=>`<button class="${pt==x?'on':''}" onclick="V.pt='${x}';render()">${KS[x][0]}</button>`).join('')}</div>
<div class=c style="display:flex;gap:14px;align-items:center">${ring(tot?dn/tot:0,KS[pt][1],72)}<div><div class=m>${pt=='inc'?'Received':pt=='inv'?'Invested':'Paid'} so far</div><div class=big>${f(dn)}</div><div class=m>of ${f(tot)} planned, ${f(tot-dn)} to go</div></div></div>
<div class=c>${L.map(p=>`<div class=r style="${d(p)?'opacity:.6':''}"><button class="ck ${d(p)?'on':''}" onclick="tg('${p.id}')" aria-label="Mark ${e(p.n)}">${d(p)?'✓':''}</button><div onclick="planForm(S.plan.find(x=>x.id=='${p.id}'))" style="flex:1"><b>${e(p.n)}</b><div class=m>Day ${p.day} · ${e(src(p.s))}</div></div><b>${f(p.a)}</b></div>`).join('')||'<div class=m>Nothing planned yet.</div>'}<button class=add onclick="planForm({k:'${pt}'})">+ Add ${KS[pt][2]}</button></div>
${pt=='exp'&&bl.length?`<div class=c><h3>Credit card bills due</h3>${bl.map(x=>`<div class=r><div style="flex:1"><b>${e(x.c.n)}</b><div class=m>Due ${x.b.dueD.slice(5)}</div></div><b>${f(x.b.pay)}</b>${x.b.pay>0?`<button class=pri onclick="payCard('${x.c.id}')">Pay</button>`:'<span class=ok>Paid</span>'}</div>`).join('')}</div>`:''}`}
const hist=()=>`<div class=c>${mt().sort((a,b)=>b.d.localeCompare(a.d)).map(t=>`<div class=r onclick="txForm(S.tx.find(x=>x.id=='${t.id}'))"><div><b>${e(t.n||t.c||'Entry')}</b><div class=m>${t.d.slice(5)} · ${e(t.c||'')} · ${e(src(t.s))}${t.t=='pay'?' → '+e(src(t.cd)):''}</div></div><b class="${t.t=='inc'?'ok':''}">${t.t=='inc'?'+':'-'}${f(t.a)}</b></div>`).join('')||'<div class=m>No entries this month.</div>'}</div>`;
const more=()=>`<div class=c><h3>Bank accounts</h3>${S.acc.map(a=>`<div class=r onclick="accForm(S.acc.find(x=>x.id=='${a.id}'))"><span>${e(a.n)}</span><b>${f(accBal(a))}</b></div>`).join('')||'<div class=m>No accounts yet.</div>'}<button style="width:100%;margin-top:8px" onclick="accForm()">Add bank account</button></div>
<div class=c><h3>Settings</h3><div class=r><span>Monthly budget</span><b>${f(S.budget)}</b></div><button style="width:100%" onclick="budForm()">Set monthly budget</button><div class=row><button onclick="bk()">Export backup</button><button onclick="imp.click()">Import backup</button></div><input type=file id=imp accept=.json hidden onchange="ld(this)"></div>
<div class=c><h3>Install on your phone</h3><div class=m>Android Chrome: menu, Install app. iPhone Safari: Share, Add to Home Screen. Data stays on this device, so export a backup regularly.</div></div>`;
function render(){const P={home,cards,plan,hist,more};$('#app').innerHTML=`<header><b>FinPlan</b>${V.t!='more'?`<div class=mn><button onclick="mv(-1)" aria-label="Previous month">‹</button><span>${mo()}</span><button onclick="mv(1)" aria-label="Next month">›</button></div>`:''}</header><main>${P[V.t]()}</main><button class=fab onclick="txForm()" aria-label="Add entry">+</button><nav>${[['home','Home','M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z'],['cards','Cards','M2 6h20v12H2zM2 10h20'],['plan','Plan','M4 5h16v16H4zM4 10h16M8 3v4M16 3v4'],['hist','History','M4 6h16M4 12h16M4 18h10'],['more','More','M5 12h.01M12 12h.01M19 12h.01']].map(([k,l,p])=>`<button class="${V.t==k?'on':''}" onclick="go('${k}')"><svg viewBox="0 0 24 24"><path d="${p}"/></svg>${l}</button>`).join('')}</nav>`}
function go(t){if(V.t==t)return;const h=V.t=='home';V.t=t;if(t=='home'&&history.state&&history.state.t!='home')history.back();else{history[h?'pushState':'replaceState']({t},'');render()}}
history.replaceState({t:V.t},'');
addEventListener('popstate',e=>{const d=$('#dlg');if(d.open)d.close();if(e.state&&e.state.t&&e.state.t!=V.t){V.t=e.state.t;render()}});
$('#dlg').addEventListener('close',()=>{if(history.state&&history.state.dlg)history.back()});
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
